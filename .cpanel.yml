---
# cPanel deployment for MBA 775.
#
# The server clones this repository through cPanel's Git Version Control and
# runs these tasks when you click "Deploy HEAD Commit". Nothing is uploaded by
# hand, so the published site is always exactly some commit -- there is no
# third copy to drift out of step.
#
# DEPLOYPATH must match your account. Home directory is /home/crookerf, so the
# web root is almost certainly /home/crookerf/public_html. Confirm it in
# cPanel -> File Manager before the first deploy: the folder that contains
# your current faculty page is the right parent.
#
# Only docs/ is published. The .qmd sources, data, and tools stay in the
# repository and never reach the web server.
deployment:
  tasks:
    - export DEPLOYPATH=/home/crookerf/public_html/mba775
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R docs/. $DEPLOYPATH/
